name: Build theme preview

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global hexo-cli@^4.3.2
      - run: hexo init preview --no-install
      - run: npm install --no-audit --no-fund
        working-directory: preview
      - run: npm install --no-audit --no-fund hexo-renderer-pug@^3.0.0 hexo-renderer-dartsass@^1.2.0
        working-directory: preview
      - run: cp -a "$GITHUB_WORKSPACE/." themes/claudia && perl -0pi -e 's/theme: landscape/theme: claudia/' _config.yml
        working-directory: preview
      - run: npx hexo clean && npx hexo generate
        working-directory: preview
